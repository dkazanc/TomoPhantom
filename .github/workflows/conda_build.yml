name: conda
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
      - uses: prefix-dev/rattler-build-action@v0.2.37
        with:
          recipe-path: recipe.yaml
          build-args: --experimental
          artifact-name: package-${{ matrix.os }}
      - if: startsWith(matrix.os, 'ubuntu')
        name: check glibc support
        env:
          GLIBC_MAX: '2.28' # see recipe.yaml
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          unzip -q output/*/lib*.conda 'pkg-*' -d "$d"
          tar --zstd -xf "$d"/pkg-*.tar.zst -C "$d"
          max=$(objdump -T "$d"/lib/libtomophantom.so | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "expected max glibc symbol: GLIBC_${GLIBC_MAX} ; found: $max"
          if [[ $(printf '%s\n%s\n' "$GLIBC_MAX" "${max#GLIBC_}" | sort -V | tail -1) != "$GLIBC_MAX" ]] ; then
            echo "FAIL: $max > GLIBC_${GLIBC_MAX}" >&2
            exit 1
          fi
      - if: startsWith(matrix.os, 'macos')
        name: check OS support
        env:
          MINOS_MAX: '11.0' # conda-forge floor; deployment target is set by the toolchain, not the runner
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          unzip -q output/osx-*/*.conda 'pkg-*' -d "$d"
          tar --zstd -xf "$d"/pkg-*.tar.zst -C "$d"
          f=$(find "$d" -name 'libtomophantom*' -type f | head -1)
          [[ -n "$f" ]] || { echo "FAIL: no libtomophantom binary in package" >&2; exit 1; }
          minos=$(otool -l "$f" | awk '
            /LC_BUILD_VERSION/      {inb=1; next}
            /LC_VERSION_MIN_MACOSX/ {inb=1; next}
            inb && $1=="minos"   {print $2; exit}
            inb && $1=="version" {print $2; exit}
          ')
          [[ -n "$minos" ]] || { echo "FAIL: no macOS version load command in $f" >&2; exit 1; }
          minos=${minos%.*} # drop patch component for comparison
          echo "expected max min-os: ${MINOS_MAX} ; found: $minos"
          if [[ $(printf '%s\n%s\n' "$MINOS_MAX" "$minos" | sort -V | tail -1) != "$MINOS_MAX" ]] ; then
            echo "FAIL: min-os $minos > ${MINOS_MAX}" >&2
            exit 1
          fi
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        name: conda upload -c httomo
        run: |
          rattler-build upload anaconda -o httomo -f ./output/*/lib*.conda     # library
          if [[ ${{ matrix.os }} =~ ubuntu* ]] ; then
            rattler-build upload anaconda -o httomo -f ./output/noarch/*.conda # noarch: python
          fi
        shell: bash
        env:
          ANACONDA_API_KEY: ${{ secrets.HTTOMO_TOKEN_27 }}
